<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
    }
    .section {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    p.hint {
      color: #666;
      font-size: 13px;
      margin: 6px 0 0 26px;
    }
    .save-btn {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #0072bc;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
    }
    .status.ok { color: #1a7a3c; }
    .status.fail { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Ariston NET</h1>

  <div class="section">
    <label>
      <input type="checkbox" id="write_enabled">
      <span>Schrijven naar de ketel toestaan</span>
    </label>
    <p class="hint">
      Staat standaard uit. Zolang dit uit staat, leest de app alleen de
      ketel uit en verandert er nooit iets (doeltemperatuur, modus,
      warmwater). Alleen aanzetten na overleg met Michel dat schrijven
      veilig is.
    </p>
  </div>

  <button class="save-btn" onclick="saveSettings()">Opslaan</button>
  <div id="status" class="status"></div>

  <script>
    async function loadSettings() {
      try {
        const s = await Homey.api('GET', '/settings', null);
        document.getElementById('write_enabled').checked = !!s.write_enabled;
      } catch (e) {
        console.error('loadSettings error:', e);
      }
      Homey.ready();
    }

    async function saveSettings() {
      const statusEl = document.getElementById('status');
      statusEl.className = 'status';
      statusEl.textContent = 'Opslaan...';
      try {
        const write_enabled = document.getElementById('write_enabled').checked;
        const r = await Homey.api('POST', '/save_settings', { write_enabled });
        statusEl.className = 'status ' + (r.success ? 'ok' : 'fail');
        statusEl.textContent = r.success ? 'Opgeslagen.' : 'Opslaan mislukt.';
      } catch (e) {
        statusEl.className = 'status fail';
        statusEl.textContent = 'Opslaan mislukt: ' + (e && e.message ? e.message : e);
      }
    }

    loadSettings();
  </script>
</body>
</html>
