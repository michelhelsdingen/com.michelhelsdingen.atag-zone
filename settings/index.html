<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .section {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    p.hint {
      color: #666;
      font-size: 13px;
      margin: 6px 0 0 26px;
    }
    .save-btn {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #0072bc;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .status { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #1a7a3c; }
    .status.fail { color: #c0392b; }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title">ATAG Zone</h1>

  <div class="section">
    <label>
      <input type="checkbox" id="write_enabled">
      <span id="lbl">Schrijven naar de ketel toestaan</span>
    </label>
    <p class="hint" id="hint">
      Staat standaard uit. Zolang dit uit staat leest de app alleen de ketel uit
      en verandert er nooit iets aan je verwarming. Zet dit pas aan als je hebt
      gecontroleerd dat het instellen van de temperatuur bij jouw installatie
      goed werkt.
    </p>
  </div>

  <button class="save-btn" id="save">Opslaan</button>
  <div id="status" class="status"></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var box = document.getElementById('write_enabled');
      var status = document.getElementById('status');

      function setStatus(text, ok) {
        status.textContent = text || '';
        status.className = 'status' + (text ? (ok ? ' ok' : ' fail') : '');
      }

      Homey.get('write_enabled', function (err, value) {
        if (err) {
          setStatus('Instelling kon niet worden geladen.', false);
        } else {
          box.checked = Boolean(value);
        }
        Homey.ready();
      });

      document.getElementById('save').addEventListener('click', function () {
        setStatus('Opslaan...', true);
        Homey.set('write_enabled', box.checked, function (err) {
          if (err) return setStatus('Opslaan mislukt: ' + err, false);
          setStatus(box.checked
            ? 'Opgeslagen. Schrijven naar de ketel staat nu AAN.'
            : 'Opgeslagen. De app leest alleen.', true);
        });
      });
    }
  </script>
</body>
</html>
